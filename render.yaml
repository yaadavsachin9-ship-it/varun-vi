services:
  # ---- Backend: FastAPI + WebSockets ----
  - type: web
    name: varun-vi-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python data/seed_villages.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/flood_prediction.db
      - key: USE_REDIS
        value: "false"
      - key: ALERT_SIMULATION_MODE
        value: "true"
      - key: OPENWEATHER_API_KEY
        value: demo
      - key: DEFAULT_REGION
        value: Chamoli_Valley_Uttarakhand

  # ---- Frontend: Vite + React static build ----
  - type: web
    name: varun-vi-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
